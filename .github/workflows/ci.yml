name: VIDYA-X AI — CI & Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov

    - name: Initialize test database schema
      run: |
        python scripts/init_db.py sqlite:///./ci_test.db

    - name: Run Pytest test suite
      env:
        DATABASE_URL: sqlite:///./ci_test.db
        EMBEDDING_PROVIDER: local
        DEMO_MODE_ENABLED: true
      run: |
        pytest backend/ -v

    - name: Run standalone verification scripts
      env:
        DATABASE_URL: sqlite:///./ci_test.db
      run: |
        python backend/test_bkt.py
        python backend/test_quiz.py
